      } else {
        THUMB_IMG.style.display = 'none'; THUMB_PH.style.display = 'flex';
        THUMB_PH.textContent = 'No thumbnail';
      }
      buildQualityChips(data.qualities || []);
      if (data.has_audio === false) {
        // Nothing to extract audio from. Same cause as the bot check, so offer
        // the same one-click fix rather than letting them pick MP3 and wait.
        if (selectedFormat === 'mp3' || selectedFormat === 'txt') selectFormat('mp4');
        showAuthError(
          'YouTube returned no audio stream for this video, so MP3 and transcript '
          + 'are unavailable. That usually means it is throttling requests that are '
          + 'not signed in.', lastBrowsers, onAnalyze);
      }
      syncOptionRows();
    })
    .catch(err => { setAnalyzing(false); showError('Network error: ' + err.message); });
  }

  function startDownload(fmt) {
    const isFile = sourceMode === 'file';
    if (downloading) return;
    if (isFile ? !localFile : (!videoInfo || !currentUrl)) return;
    hideError();
    PROGRESS_CARD.classList.add('visible');
    RESULT_ROW.classList.remove('visible');
    setDownloading(true);
    updateProgress(0, 0, 0, 'Starting...');
    const body = isFile
      ? {source: 'file', path: localFile.path, format: fmt, height: selectedHeight}
      : {url: currentUrl, format: fmt,
         quality: (fmt === 'mp3' || fmt === 'txt') ? 'Best' : selectedQuality};
    if (fmt === 'txt') { body.model = selectedModel; body.lang = selectedLang; }

    api('/api/download', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        setDownloading(false);
        showError(data.error);
        PROGRESS_CARD.classList.remove('visible');
        return;
      }
      taskId = data.task_id;
      pollProgress(taskId);
    })
    .catch(err => { setDownloading(false); showError('Network error: ' + err.message); PROGRESS_CARD.classList.remove('visible'); });
  }

  function pollProgress(id) {
    if (pollTimer) clearTimeout(pollTimer);
    api('/api/progress/' + id)
    .then(r => r.json())
    .then(data => {
      if (data.error && !data.done) { setDownloading(false); showError(data.error); PROGRESS_CARD.classList.remove('visible'); return; }
      updateProgress(data.percent, data.speed, data.eta, data.status, data.rate);
      if (data.done) {
        if (data.cancelled) {
          setDownloading(false); STATUS_TEXT.textContent = 'Cancelled';
          PROGRESS_CARD.classList.remove('visible'); BAR_FILL.style.width = '0%'; PCT_TEXT.textContent = ''; SPEED_TEXT.textContent = '';
        } else if (data.already_exists) {
          setDownloading(false);
          STATUS_TEXT.textContent = 'Already downloaded — check ~/Downloads/Y2obi/';
          SPEED_TEXT.textContent = '';
          toast('File already exists in ~/Downloads/Y2obi/');
        } else if (data.error) {
          setDownloading(false);
          PROGRESS_CARD.classList.remove('visible');
          if (data.needs_cookies) showAuthError(data.error, data.browsers, () => startDownload(selectedFormat));
          else showError(data.error);
        } else {
          setDownloading(false);
          const extras = data.extra_filenames || [];
          STATUS_TEXT.textContent = extras.length
            ? 'Saved .txt + .srt to ~/Downloads/Y2obi/'
            : 'Saved to ~/Downloads/Y2obi/';
          SPEED_TEXT.textContent = 'Done';
          RESULT_ROW.classList.toggle('visible', !!data.filename);
          OPEN_FILE_BTN.textContent = extras.length ? 'Open transcript' : 'Open file';
          toast(data.filename ? 'Saved: ' + data.filename : 'Done! Check ~/Downloads/Y2obi/');
        }
        return;
      }
      pollTimer = setTimeout(() => pollProgress(id), 500);
    })
    .catch(() => { pollTimer = setTimeout(() => pollProgress(id), 1000); });
  }

  function onCancel() {
    if (!taskId) return;
    api('/api/cancel/' + taskId, {method: 'POST'})
      .then(() => STATUS_TEXT.textContent = 'Cancelling...')
      .catch(() => {});
  }
});
</script>
</body>
</html>
