name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination core\ffmpeg.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-extract

      - name: Build exe
        run: pyinstaller build.spec

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path dist\Y2obi.exe -DestinationPath Y2obi-win.zip

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path Y2obi-win.zip -Algorithm SHA256).Hash
          "SHA256  $hash  Y2obi-win.zip" | Out-File -FilePath checksum.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Y2obi-win.zip
            checksum.txt
          generate_release_notes: true
          body: |
            > **Windows blocked the download or shows a SmartScreen warning?**
            > That's expected for an unsigned indie app, not a sign of malware — see the
            > [Download](https://github.com/DesvoSoft/Y2obi#download) section in the README
            > for why it happens and how to verify/run it safely.
