name: Release

on:
  push:
    tags:
      - "v*"
  # So the whole thing can be rehearsed from the Actions tab before a tag is cut.
  # Without a tag the release step is skipped and the exe is left as an artifact.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Compile PyInstaller's bootloader instead of taking the prebuilt wheel.
      # Every PyInstaller app on earth ships byte-identical bootloader code, so
      # those bytes sit in the generic-signature databases of most AV engines and
      # drag unsigned onefile builds down with them: the exe gets flagged for
      # what it was packed with, not for anything it does. Building it here gives
      # this release its own bootloader. windows-latest already has MSVC, so the
      # only cost is a couple of minutes of build time.
      #
      # Falling back to the wheel here would leave the stock bootloader in place
      # and make the whole exercise silently pointless, so the install output is
      # checked for the line that only a source build prints.
      - name: Install PyInstaller with a self-compiled bootloader
        shell: pwsh
        run: |
          pip install --no-binary pyinstaller "pyinstaller==6.20.0" 2>&1 | Tee-Object -Variable out
          if (-not ($out -match 'Building wheel for pyinstaller')) {
            throw "pip used a prebuilt wheel: the bootloader is the stock one again"
          }
          $root = python -c "import PyInstaller,os;print(os.path.dirname(PyInstaller.__file__))"
          $boot = Join-Path $root 'bootloader/Windows-64bit-intel/run.exe'
          if (-not (Test-Path $boot)) { throw "bootloader not found at $boot" }
          Write-Host "bootloader sha256 $((Get-FileHash $boot -Algorithm SHA256).Hash.ToLower())"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the archive" }
          Copy-Item $exe.FullName -Destination core/ffmpeg.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-extract

      - name: Download whisper.cpp and the Vulkan backend
        shell: pwsh
        run: |
          # Both releases are pinned. core/whisper/MANIFEST.json holds the sha256
          # of every file copied here and build.spec refuses to build when one
          # drifts, so this step cannot quietly ship a different combination.
          # The Vulkan backend comes from llama.cpp because whisper.cpp publishes
          # no Vulkan build for Windows; they share ggml, and the pair is checked
          # end to end by tools/verify_whisper.py.
          New-Item -ItemType Directory -Force -Path core/whisper | Out-Null

          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip" -OutFile whisper.zip
          Expand-Archive -Path whisper.zip -DestinationPath whisper-extract

          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b10472/llama-b10472-bin-win-vulkan-x64.zip" -OutFile vulkan.zip
          Expand-Archive -Path vulkan.zip -DestinationPath vulkan-extract

          $fromWhisper = @(
            'whisper-cli.exe',
            'whisper.dll',
            'ggml.dll',
            'ggml-base.dll',
            'ggml-cpu-haswell.dll',
            'ggml-cpu-x64.dll'
          )
          foreach ($name in $fromWhisper) {
            $src = Get-ChildItem -Path whisper-extract -Recurse -Filter $name | Select-Object -First 1
            if (-not $src) { throw "$name not found in the whisper.cpp release" }
            Copy-Item $src.FullName -Destination core/whisper/
          }

          $vk = Get-ChildItem -Path vulkan-extract -Recurse -Filter ggml-vulkan.dll | Select-Object -First 1
          if (-not $vk) { throw "ggml-vulkan.dll not found in the llama.cpp release" }
          Copy-Item $vk.FullName -Destination core/whisper/

          Remove-Item whisper.zip, vulkan.zip
          Remove-Item -Recurse -Force whisper-extract, vulkan-extract

      - name: Download deno
        shell: pwsh
        run: |
          # Runs yt-dlp's YouTube challenge solver; a signed-in session gets
          # thumbnails only without it. Pinned in build.spec (DENO_VERSION and
          # DENO_SHA256), which refuses to build on a mismatch; checked here too
          # so a drift is named instead of buried in the PyInstaller log.
          $version = '2.9.7'
          $expected = 'e020f3e232bd16e33768dee528e5983349c962952051ced0a5d58ad42f5d9b33'
          New-Item -ItemType Directory -Force -Path core/deno | Out-Null
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v$version/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive -Path deno.zip -DestinationPath core/deno -Force
          Remove-Item deno.zip
          $actual = (Get-FileHash -Path core/deno/deno.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "deno.exe sha256 $actual, expected $expected" }
          & core/deno/deno.exe --version

      - name: Verify the pinned binaries
        shell: pwsh
        run: |
          # build.spec would catch this too, but failing here says plainly which
          # file drifted instead of burying it in a PyInstaller run.
          $manifest = Get-Content core/whisper/MANIFEST.json | ConvertFrom-Json
          $bad = 0
          foreach ($name in $manifest.files.PSObject.Properties.Name) {
            $expected = $manifest.files.$name.sha256
            $path = "core/whisper/$name"
            if (-not (Test-Path $path)) { Write-Host "MISSING $name"; $bad++; continue }
            $actual = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Host "MISMATCH $name"
              Write-Host "  expected $expected"
              Write-Host "  actual   $actual"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad pinned file(s) do not match MANIFEST.json" }
          Write-Host "all $($manifest.files.PSObject.Properties.Name.Count) pinned files match"

      - name: Build exe
        run: pyinstaller build.spec

      # v1.4.0 downloads clean and v1.4.1 does not, from source that differs by
      # one bugfix and a release-note edit -- and there was no way to tell what
      # else moved between them, because nothing recorded it. ffmpeg comes from a
      # "latest release" URL and the Python deps float within their ranges, so
      # two builds a day apart can legitimately differ. This makes each release
      # say what it was made of, so the next comparison is a diff and not a
      # guess.
      - name: Record what this build was made of
        shell: pwsh
        run: |
          $lines = @("Y2obi build inputs", "built  $((Get-Date).ToUniversalTime().ToString('u'))",
                     "commit $env:GITHUB_SHA", "runner $env:RUNNER_OS", "")
          $lines += "python  $(python --version)"
          $lines += "pyinstaller $(pyinstaller --version)"
          $lines += (pip freeze | Where-Object { $_ -match '^(yt-dlp|yt-dlp-ejs|flask|pywebview|werkzeug)=' })
          $lines += "deno    sha256 $((Get-FileHash core/deno/deno.exe -Algorithm SHA256).Hash.ToLower())"
          $lines += ""
          $ff = & core/ffmpeg.exe -version 2>&1 | Select-Object -First 1
          $lines += "ffmpeg  $ff"
          $lines += "ffmpeg  sha256 $((Get-FileHash core/ffmpeg.exe -Algorithm SHA256).Hash.ToLower())"
          $lines += ""
          Get-ChildItem core/whisper -Filter *.dll | ForEach-Object {
            $lines += "whisper $($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())"
          }
          $lines | Out-File -FilePath build-info.txt -Encoding utf8
          Get-Content build-info.txt

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path dist/Y2obi.exe -DestinationPath Y2obi-win.zip

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path Y2obi-win.zip -Algorithm SHA256).Hash
          "SHA256  $hash  Y2obi-win.zip" | Out-File -FilePath checksum.txt -Encoding utf8

      # On a manual run there is no tag to attach a release to, so keep the build
      # as a downloadable artifact instead. This is what makes a rehearsal useful.
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: Y2obi-win
          path: |
            Y2obi-win.zip
            checksum.txt
            build-info.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Y2obi-win.zip
            checksum.txt
            build-info.txt
          generate_release_notes: true
          body: |
            > **Windows blocked the download or shows a SmartScreen warning?**
            > That's expected for an unsigned app, not a sign of malware.
            >
            > Y2obi is built by an independent developer, and a Windows
            > code-signing certificate is a recurring cost this project doesn't
            > justify yet. Without one, Windows has no publisher to vouch for and
            > warns about any new executable until enough people have run it.
            >
            > If that leaves you uneasy, don't take my word for it: **the whole
            > source is here to read**, this release was built by a
            > [public GitHub Actions workflow](https://github.com/DesvoSoft/Y2obi/blob/main/.github/workflows/release.yml)
            > you can inspect, and `checksum.txt` lets you verify the download is
            > byte-for-byte what CI produced. You can also skip the exe entirely
            > and [run it from source](https://github.com/DesvoSoft/Y2obi#run-from-source).
            >
            > See the [Download](https://github.com/DesvoSoft/Y2obi#download)
            > section of the README for how to get past the warning.

            <!-- The generated notes above are a commit list. Write the release
                 description by hand afterwards: what changed for someone using
                 the app, not what changed in the tree. -->
