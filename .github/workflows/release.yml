name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination core\ffmpeg.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-extract

      - name: Download whisper.cpp and the Vulkan backend
        shell: pwsh
        run: |
          # Pinned on purpose: core/whisper/MANIFEST.json records the sha256 of
          # every file below and build.spec refuses to build if one drifts. The
          # Vulkan backend comes from llama.cpp because whisper.cpp publishes no
          # Vulkan build for Windows; they share ggml and the pair is verified
          # with tools/verify_whisper.py.
          New-Item -ItemType Directory -Force -Path core\whisper | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip" -OutFile whisper.zip
          Expand-Archive -Path whisper.zip -DestinationPath whisper-extract
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b10472/llama-b10472-bin-win-vulkan-x64.zip" -OutFile vulkan.zip
          Expand-Archive -Path vulkan.zip -DestinationPath vulkan-extract
          $fromWhisper = @('whisper-cli.exe','whisper.dll','ggml.dll','ggml-base.dll','ggml-cpu-haswell.dll','ggml-cpu-x64.dll')
          foreach ($name in $fromWhisper) {
            $src = Get-ChildItem -Path whisper-extract -Recurse -Filter $name | Select-Object -First 1
            if (-not $src) { throw "$name not found in the whisper.cpp release" }
            Copy-Item $src.FullName -Destination core\whisper          }
          $vk = Get-ChildItem -Path vulkan-extract -Recurse -Filter ggml-vulkan.dll | Select-Object -First 1
          if (-not $vk) { throw "ggml-vulkan.dll not found in the llama.cpp release" }
          Copy-Item $vk.FullName -Destination core\whisper          Remove-Item whisper.zip, vulkan.zip
          Remove-Item -Recurse -Force whisper-extract, vulkan-extract

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build exe
        run: pyinstaller build.spec

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path dist\Y2obi.exe -DestinationPath Y2obi-win.zip

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path Y2obi-win.zip -Algorithm SHA256).Hash
          "SHA256  $hash  Y2obi-win.zip" | Out-File -FilePath checksum.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Y2obi-win.zip
            checksum.txt
          generate_release_notes: true
          body: |
            > **Windows blocked the download or shows a SmartScreen warning?**
            > That's expected for an unsigned indie app, not a sign of malware — see the
            > [Download](https://github.com/DesvoSoft/Y2obi#download) section in the README
            > for why it happens and how to verify/run it safely.
